services:
  database:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${TRACCAR_DB_PASSWORD}
      TRACCAR_REACT_API_DB_PASSWORD: ${TRACCAR_REACT_API_DB_PASSWORD}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - database-data:/var/lib/postgresql/data
      - ../traccar-react/scripts/docker_init_traccar_react_api_db.sh:/docker-entrypoint-initdb.d/10-create-traccar-react-api-db.sh:ro
      - ../traccar-react/scripts:/traccar-react-api-bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U traccar -d traccar"]
      interval: 5s
      timeout: 5s
      retries: 20

  traccar:
    image: traccar/traccar:${TRACCAR_VERSION}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD}
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
    ports:
      - "127.0.0.1:8092:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/api/health"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 10

  traccar-react-api-api:
    build:
      context: ../traccar-react
      dockerfile: Dockerfile.first-test-api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5124
      ConnectionStrings__TraccarReactApi: "Host=database;Port=5432;Database=traccar_react_api;Username=traccar_react_api;Password=${TRACCAR_REACT_API_DB_PASSWORD}"
      TraccarReactApi__Auth__Username: ${APP_ADMIN_USERNAME}
      TraccarReactApi__Auth__Password: ${APP_ADMIN_PASSWORD}
      TraccarReactApi__Auth__AllowUnauthenticatedDevelopment: "false"
      TraccarReactApi__CredentialEncryption__ActiveKeyId: first-test
      TraccarReactApi__CredentialEncryption__Keys__first-test: ${TRACCAR_REACT_API_CREDENTIAL_KEY}
      Traccar__BaseUrl: http://traccar:8082
      TraccarReactApi__Email__Provider: Disabled
      TraccarReactApi__Sms__Provider: Disabled
    expose:
      - "5124"

  web:
    build:
      context: ../traccar-react
      dockerfile: Dockerfile.first-test-web
    restart: unless-stopped
    depends_on:
      traccar:
        condition: service_healthy
      traccar-react-api-api:
        condition: service_started
    ports:
      - "127.0.0.1:8089:80"

volumes:
  database-data:
  traccar-data:
  traccar-logs:
