# Limestone production app services only. This file intentionally has no database
# service or volume; both app containers join the existing Traccar network.
services:
  traccar-scope-api:
    build:
      context: ../..
      dockerfile: scripts/installer-templates/Dockerfile.traccar-scope-api
    restart: unless-stopped
    env_file:
      - ${TRACCAR_SCOPE_API_ENV_FILE:?Set TRACCAR_SCOPE_API_ENV_FILE to a protected runtime env file}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5124
      TraccarScopeApi__Auth__AllowUnauthenticatedDevelopment: "false"
      Traccar__BaseUrl: http://traccar:8082
    expose:
      - "5124"
    networks:
      - traccar

  web:
    build:
      context: ../..
      dockerfile: scripts/installer-templates/Dockerfile.traccar-scope-web
    restart: unless-stopped
    depends_on:
      traccar-scope-api:
        condition: service_started
    ports:
      - "127.0.0.1:${TRACCAR_SCOPE_WEB_PORT:-8090}:80"
    networks:
      - traccar

networks:
  traccar:
    external: true
    name: traccar_default
